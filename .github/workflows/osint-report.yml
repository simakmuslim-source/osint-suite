name: OSINT Report

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Username to search'
        required: false
      phone:
        description: 'Phone number'
        required: false
      notes:
        description: 'Additional notes'
        required: false
  issues:
    types: [opened, labeled]

jobs:
  generate-report:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'osint-request')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report
        run: |
          echo "# OSINT Report" > report.md
          echo "Generated by GitHub Actions" >> report.md
          echo "" >> report.md
          if [ -n "${{ github.event.inputs.username }}" ]; then
            echo "## Username: ${{ github.event.inputs.username }}" >> report.md
            python cli.py username "${{ github.event.inputs.username }}" || true
          fi
          if [ -n "${{ github.event.inputs.phone }}" ]; then
            echo "## Phone: ${{ github.event.inputs.phone }}" >> report.md
          fi
          echo "## Notes" >> report.md
          echo "${{ github.event.inputs.notes }}" >> report.md
          cat report.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osint-report
          path: |
            report.md
            *.json
